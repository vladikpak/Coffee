name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: |
        cd Coffee
        mvn clean compile

    - name: Run tests
      run: |
        cd Coffee
        mvn test

    - name: Run Checkstyle
      run: |
        cd Coffee
        mvn checkstyle:check

    - name: Deploy to Render
      if: github.ref == 'refs/heads/main'
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"