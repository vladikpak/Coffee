databaseChangeLog:
  - changeSet:
      id: 001_create_users_table
      author: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(255)
              - column:
                  name: money
                  type: integer
              - column:
                  name: phone
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: image
                  type: varchar(255)
