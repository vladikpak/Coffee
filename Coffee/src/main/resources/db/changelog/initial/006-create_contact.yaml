databaseChangeLog:
  - changeSet:
      id: 006_create_contacts_table
      author: users
      ifNotExists: true
      changes:
        - createTable:
            tableName: contacts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: subject
                  type: varchar(255)
              - column:
                  name: message
                  type: varchar(65535)
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: status
                  type: varchar(255)
              - column:
                  name: admin_reply
                  type: varchar(255)
              - column:
                  name: replied_at
                  type: timestamp
              - column:
                  name: admin_id
                  type: bigint
              - column:
                  name: user_id
                  type: bigint
        - addForeignKeyConstraint:
            constraintName: fk_contact_admin
            baseTableName: contacts
            baseColumnNames: admin_id
            referencedTableName: users
            referencedColumnNames: id